<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We're Sorry to See You Go - HEIC Converter</title>
    <script src="variables.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* shadcn/ui inspired styles */
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --card: 0 0% 100%;
            --card-foreground: 222.2 84% 4.9%;
            --popover: 0 0% 100%;
            --popover-foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 47.4% 11.2%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 210 40% 96.1%;
            --accent-foreground: 222.2 47.4% 11.2%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --radius: 0.5rem;
        }
        
        .card {
            background: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: calc(var(--radius) * 1px);
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: calc(var(--radius) * 1px);
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .btn-primary {
            background: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
        }
        
        .btn-primary:hover {
            opacity: 0.9;
        }
        
        .btn-secondary {
            background: hsl(var(--secondary));
            color: hsl(var(--secondary-foreground));
        }
        
        .btn-secondary:hover {
            opacity: 0.8;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        
        .uninstall-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        
        .uninstall-header {
            flex-shrink: 0;
            padding: 1.5rem;
            background: hsl(var(--background));
            border-bottom: 1px solid hsl(var(--border));
        }
        
        .uninstall-message {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        
        .uninstall-iframe-wrapper {
            flex: 1;
            width: 100%;
            overflow: auto;
            position: relative;
        }
        
        .uninstall-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="uninstall-container">
        <!-- Header Message -->
        <div class="uninstall-header">
            <div class="uninstall-message">
                <h1 class="text-2xl font-bold text-slate-900 mb-2">
                    We're Sorry to See You Go
                </h1>
                <p class="text-slate-600 leading-relaxed">
                    We're sorry that <strong class="font-semibold text-slate-900" data-var="extensionName">PLACEHOLDER</strong> didn't meet your needs. We would be grateful if you could share your concerns and issues with the extension in the form below. Your feedback helps us improve and create better tools for everyone.
                </p>
            </div>
        </div>

        <!-- Google Form iframe -->
        <div class="uninstall-iframe-wrapper">
            <iframe 
                class="uninstall-iframe"
                src="https://docs.google.com/forms/d/e/1FAIpQLSfGDGwzuMHQf7OPAjsF-Jkb3HQUS4oFe8-vPbDy5AKnzAGEuw/viewform?embedded=true"
                frameborder="0"
                marginheight="0"
                marginwidth="0"
                title="Uninstall Feedback Form">
                Loading…
            </iframe>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
